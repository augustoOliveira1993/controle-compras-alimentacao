services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27117:27017"]
    volumes:
      - dados:/data/db
      - ./docker/mongo/init-replica-set.js:/opt/init-replica-set.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/opt/init-replica-set.js"]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/compras?replicaSet=rs0
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports: ["127.0.0.1:3000:3000"]
volumes:
  dados: {}
